name: バグ報告
description: 再現可能な不具合を報告します
title: '[Bug]: '
labels: ['type:bug']
body:
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 問題を簡潔に説明してください。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      placeholder: |
        1. 管理画面を開く
        2. 操作を実行する
        3. エラーを確認する
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する結果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の結果
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 環境
      description: play-cmsのコミット、実行環境、Node.js、ブラウザを記載してください。
    validations:
      required: true
  - type: checkboxes
    id: security
    attributes:
      label: セキュリティ確認
      options:
        - label: 秘密情報や脆弱性の詳細を含んでいません
          required: true
